name: 'Build and Release aria2'

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  release:
    types:
      - released
  schedule:
    - cron: "0 0 * * 6"

jobs:
  resolve-versions:
    name: Resolve Dependency Versions
    runs-on: ubuntu-latest
    outputs:
      ZLIB_NG_TAG: ${{ steps.versions.outputs.ZLIB_NG_TAG }}
      ZLIB_TAG: ${{ steps.versions.outputs.ZLIB_TAG }}
      XZ_TAG: ${{ steps.versions.outputs.XZ_TAG }}
      OPENSSL_TAG: ${{ steps.versions.outputs.OPENSSL_TAG }}
      LIBRESSL_TAG: ${{ steps.versions.outputs.LIBRESSL_TAG }}
      LIBXML2_TAG: ${{ steps.versions.outputs.LIBXML2_TAG }}
      SQLITE_TAG: ${{ steps.versions.outputs.SQLITE_TAG }}
      CARES_TAG: ${{ steps.versions.outputs.CARES_TAG }}
      LIBSSH2_TAG: ${{ steps.versions.outputs.LIBSSH2_TAG }}
    steps:
      - name: Fetch latest dependency versions
        id: versions
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

          fetch_tag() {
            local repo="$1"
            local resp
            resp=$(curl -fsS "https://api.github.com/repos/${repo}/releases")
            echo "$resp" | jq -r '.[0].tag_name'
          }

          ZLIB_NG_TAG_VAL=$(fetch_tag zlib-ng/zlib-ng)
          ZLIB_TAG_VAL=$(fetch_tag madler/zlib)
          XZ_TAG_VAL="5.8.0"
          OPENSSL_TAG_VAL=$(fetch_tag openssl/openssl)
          LIBRESSL_TAG_VAL=$(fetch_tag libressl/libressl)
          LIBXML2_TAG_VAL=$(fetch_tag GNOME/libxml2)
          SQLITE_TAG_VAL=$(fetch_tag sqlite/sqlite)
          CARES_TAG_VAL=$(fetch_tag c-ares/c-ares)
          LIBSSH2_TAG_VAL=$(fetch_tag libssh2/libssh2)

          echo "ZLIB_NG_TAG=${ZLIB_NG_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "ZLIB_TAG=${ZLIB_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "XZ_TAG=${XZ_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "OPENSSL_TAG=${OPENSSL_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "LIBRESSL_TAG=${LIBRESSL_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "LIBXML2_TAG=${LIBXML2_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "SQLITE_TAG=${SQLITE_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "CARES_TAG=${CARES_TAG_VAL}" >> $GITHUB_OUTPUT
          echo "LIBSSH2_TAG=${LIBSSH2_TAG_VAL}" >> $GITHUB_OUTPUT

          echo "=== Resolved Versions ==="
          echo "zlib-ng:    ${ZLIB_NG_TAG_VAL}"
          echo "zlib:       ${ZLIB_TAG_VAL}"
          echo "xz:         ${XZ_TAG_VAL}"
          echo "openssl:    ${OPENSSL_TAG_VAL}"
          echo "libressl:   ${LIBRESSL_TAG_VAL}"
          echo "libxml2:    ${LIBXML2_TAG_VAL}"
          echo "sqlite:     ${SQLITE_TAG_VAL}"
          echo "c-ares:     ${CARES_TAG_VAL}"
          echo "libssh2:    ${LIBSSH2_TAG_VAL}"

  create-prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Installation depends
        run: |
          sudo apt-get update
          sudo apt-get upgrade

  static-build:
    name: "Build ${{ matrix.cross_host }} (libressl=${{ matrix.use_libressl }})"
    needs: resolve-versions
    runs-on: ubuntu-latest
    container: "abcfy2/muslcc-toolchain-ubuntu:${{ matrix.cross_host }}"
    strategy:
      fail-fast: false
      matrix:
        cross_host:
          - arm-linux-musleabi
          - aarch64-linux-musl
          - x86_64-linux-musl
          - x86_64-w64-mingw32
          - i686-w64-mingw32
        use_libressl: [0, 1]
        include:
          - cross_host: arm-linux-musleabi
            openssl_compiler: linux-armv4
            target_host: linux
          - cross_host: aarch64-linux-musl
            openssl_compiler: linux-aarch64
            target_host: linux
          - cross_host: x86_64-linux-musl
            openssl_compiler: linux-x86_64
            target_host: linux
          - cross_host: x86_64-w64-mingw32
            openssl_compiler: mingw64
            target_host: win
          - cross_host: i686-w64-mingw32
            openssl_compiler: mingw64
            target_host: win
        exclude:
          - cross_host: x86_64-w64-mingw32
            use_libressl: 1
          - cross_host: i686-w64-mingw32
            use_libressl: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache downloads
        uses: actions/cache@v4
        id: cache
        with:
          path: downloads/
          key: build-cache-${{ matrix.cross_host }}-${{ matrix.use_libressl }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.cross_host }}-${{ matrix.use_libressl }}-

      - name: Compile
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          OPENSSL_COMPILER: "${{ matrix.openssl_compiler }}"
          TARGET_HOST: "${{ matrix.target_host }}"
          USE_LIBRESSL: "${{ matrix.use_libressl }}"
          DEP_ZLIB_NG_TAG: ${{ needs.resolve-versions.outputs.ZLIB_NG_TAG }}
          DEP_ZLIB_TAG: ${{ needs.resolve-versions.outputs.ZLIB_TAG }}
          DEP_XZ_TAG: ${{ needs.resolve-versions.outputs.XZ_TAG }}
          DEP_OPENSSL_TAG: ${{ needs.resolve-versions.outputs.OPENSSL_TAG }}
          DEP_LIBRESSL_TAG: ${{ needs.resolve-versions.outputs.LIBRESSL_TAG }}
          DEP_LIBXML2_TAG: ${{ needs.resolve-versions.outputs.LIBXML2_TAG }}
          DEP_SQLITE_TAG: ${{ needs.resolve-versions.outputs.SQLITE_TAG }}
          DEP_CARES_TAG: ${{ needs.resolve-versions.outputs.CARES_TAG }}
          DEP_LIBSSH2_TAG: ${{ needs.resolve-versions.outputs.LIBSSH2_TAG }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            export ARIA2_VER="${GITHUB_REF#refs/*/}"
            echo "ARIA2_VER=${ARIA2_VER}" >> $GITHUB_ENV
          fi
          "${GITHUB_WORKSPACE}/build.sh"

      - name: Zip archive
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          USE_LIBRESSL: "${{ matrix.use_libressl }}"
        run: |
          apt install -y zip
          if [ x"${USE_LIBRESSL}" = x"1" ]; then
            ARCHIVE_NAME="aria2-${CROSS_HOST}_libressl_static.zip"
          else
            ARCHIVE_NAME="aria2-${CROSS_HOST}_static.zip"
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          zip -j9v "/tmp/${ARCHIVE_NAME}" "${GITHUB_WORKSPACE}"/aria2c*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: /tmp/${{ env.ARCHIVE_NAME }}